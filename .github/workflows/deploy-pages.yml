name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fill in the Firebase settings
        env:
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          mkdir site
          sed -e "s|__FIREBASE_API_KEY__|${FB_API_KEY}|" \
              -e "s|__FIREBASE_AUTH_DOMAIN__|${FB_AUTH_DOMAIN}|" \
              -e "s|__FIREBASE_PROJECT_ID__|${FB_PROJECT_ID}|" \
              -e "s|__FIREBASE_APP_ID__|${FB_APP_ID}|" \
              index.template.html > site/index.html
          if grep -q "__FIREBASE_" site/index.html; then echo "A secret is missing"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
